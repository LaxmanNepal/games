name: Generate Games Registry

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'scripts/generate-games-json.py'
      - '.github/workflows/generate-games-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate games.json
        run: python scripts/generate-games-json.py

      - name: Commit registry changes
        run: |
          if git diff --quiet -- data/games.json; then
            echo "No registry changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "chore: update games registry"
          git push
