<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snake — Laxman Games</title>
<meta name="description" content="Play Snake online for free. Classic browser game with keyboard, touch and fullscreen controls.">
<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/global.css">
<link rel="stylesheet" href="../../assets/css/header.css">
<link rel="stylesheet" href="../../assets/css/footer.css">
<link rel="stylesheet" href="../../assets/css/game-shell.css">
<style>
.snake-page{padding:2rem 0 4rem}.game-wrap{max-width:760px;margin:auto}.game-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}.score{font-weight:700}.game-stage{position:relative;background:#0b1220;border-radius:18px;padding:12px;box-shadow:var(--shadow-lg)}canvas{width:100%;aspect-ratio:1;display:block;border-radius:10px;background:#111827;touch-action:none}.game-actions{display:flex;justify-content:center;gap:.7rem;margin-top:1rem;flex-wrap:wrap}.game-btn{padding:.7rem 1rem;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface);color:var(--text-primary);font-weight:600}.game-btn.primary{background:var(--brand-primary);color:#fff;border-color:var(--brand-primary)}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:1rem}.pad button{height:52px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface);color:var(--text-primary);font-size:1.2rem}.pad .empty{visibility:hidden}.hint{text-align:center;margin-top:1rem;color:var(--text-muted);font-size:.9rem}@media(min-width:768px){.snake-page{padding-top:3rem}}
</style>
</head>
<body>
<div id="site-header-mount"></div>
<main class="snake-page"><div class="container game-wrap">
<div class="game-top"><div><span class="section-label">ARCADE</span><h1>Snake</h1></div><div class="score">Score: <span id="score">0</span> · Best: <span id="best">0</span></div></div>
<section class="game-stage" id="game-stage"><canvas id="game" width="600" height="600" aria-label="Snake game"></canvas></section>
<div class="game-actions"><button class="game-btn primary" id="start">Start Game</button><button class="game-btn" id="pause">Pause</button><button class="game-btn" id="fullscreen">Fullscreen</button></div>
<div class="pad" aria-label="Touch controls"><button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<p class="hint">Use Arrow Keys or WASD. On mobile, use the controls above.</p>
</div></main>
<div id="site-footer-mount"></div>
<script src="../../assets/js/header.js"></script><script src="../../assets/js/footer.js"></script><script src="../../assets/js/fullscreen.js"></script>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),N=20,S=30;let snake,food,dir,next,score=0,timer,running=false,paused=false;const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let best=Number(localStorage.getItem('snake-best')||0);bestEl.textContent=best;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food=spawn();dir=next={x:1,y:0};score=0;scoreEl.textContent=0;draw();}
function spawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake&&snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#111827';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ef4444';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.34,0,Math.PI*2);x.fill();snake.forEach((s,i)=>{x.fillStyle=i?'#22c55e':'#4ade80';x.fillRect(s.x*S+2,s.y*S+2,S-4,S-4)});}
function step(){if(!running||paused)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){gameOver();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;food=spawn()}else snake.pop();draw()}
function start(){clearInterval(timer);reset();running=true;paused=false;timer=setInterval(step,110)}
function gameOver(){running=false;clearInterval(timer);if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=best}setTimeout(()=>alert('Game over! Score: '+score),30)}
function setDir(d){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(m&&!(m.x===-dir.x&&m.y===-dir.y))next=m}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[k];if(m){e.preventDefault();setDir(m)}if(k==='p'&&running){paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',()=>setDir(b.dataset.dir)));document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(running){paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'}};document.getElementById('fullscreen').onclick=()=>window.GameFullscreen?.toggle('game-stage');reset();})();
</script>
</body></html>
